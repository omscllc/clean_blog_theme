global-css:
  version: VERSION
  css:
    base:
      css/style.min.css: {}
  js:
    js/script.min.js: {}
  dependencies:
    - core/jquery
    - core/drupal.ajax
    - core/drupal
    - core/drupalSettings
    - core/once

bootstrap-cdn:
  version: 5.x
  js:
    https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js:
      attributes:
        minified: true
        type: external
  dependencies:
    - core/drupal.ajax
    - core/drupal
    - core/drupalSettings
    - core/once

flexslider-cdn:
  version: 2.7.2
  css:
    theme:
      https://cdnjs.cloudflare.com/ajax/libs/flexslider/2.7.2/flexslider.min.css: {}
  js:
    https://cdnjs.cloudflare.com/ajax/libs/flexslider/2.7.2/jquery.flexslider-min.js:
      attributes:
        defer: true
        minified: true
        type: external
  dependencies:
    - core/jquery