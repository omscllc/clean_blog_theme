global-css:
  version: VERSION
  css:
    base:
      css/style.min.css: {}
  js:
    js/script.js: {}
  dependencies:
    - core/jquery
    - core/drupal.ajax
    - core/drupal
    - core/drupalSettings
    - core/once

fontawesome-cdn:
  version: 6.x
  css:
    component:
      https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css: {}
    js:
      https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js: { type: external, minified: true }

bootstrap-cdn:
  version: 5.x
  css:
    theme:
      https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css: {}
  js:
    https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js: { type: external, minified: true }
  dependencies:
    - core/drupal.ajax
    - core/drupal
    - core/drupalSettings
    - core/once

flexslider-cdn:
  version: 2.7.2
  css:
    component:
      https://cdnjs.cloudflare.com/ajax/libs/flexslider/2.7.2/flexslider.min.css: {}
  js:
    https://cdnjs.cloudflare.com/ajax/libs/flexslider/2.7.2/jquery.flexslider-min.js: { type: external, minified: true }
  dependencies:
    - core/jquery